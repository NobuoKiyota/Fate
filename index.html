<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アニメ『Fate』シリーズ 徹底詳細ポータル</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="アニメFateシリーズの世界観、本編、FGO、スピンオフ、音響演出を網羅した総合Wiki">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- テーマスタイル (Dark/Light対応テーマ) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <!-- Mermaid & カスタムスタイル -->
  <style>
    :root {
      --base-font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      --theme-color: #d79b00;
      --sidebar-name-color: #f5b041;
      --sidebar-nav-link-color: #d5d8dc;
      --sidebar-nav-link-color--active: #f5b041;
      --content-max-width: 65em;
    }
    .mermaid {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: center;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">読み込み中...</div>

  <script>
    window.$docsify = {
      name: 'Fate/Anime Portal',
      repo: 'https://github.com/NobuoKiyota/Fate',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Fateの世界を検索...',
        noData: '見つかりませんでした',
        depth: 4
      },
      pagination: {
        previousText: '前の章へ',
        nextText: '次の章へ',
        crossChapter: true
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>

  <!-- Docsify コア -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 全文検索プラグイン -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- コードコピー -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- ページネーション -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- 画像ズーム -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  
  <!-- Mermaid.js -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    window.mermaid = mermaid;
  </script>
  <script>
    window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function(hook) {
      hook.doneEach(function() {
        if (window.mermaid) {
          window.mermaid.run({
            nodes: document.querySelectorAll('.mermaid')
          });
        }
      });
    });
  </script>
</body>
</html>
